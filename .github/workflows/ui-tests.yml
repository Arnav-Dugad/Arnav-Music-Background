name: UI tests (emulator)

on:
  push:
    branches: [ main, "claude/**" ]
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional: run only this class or method, e.g. com.arnav.music.NavigationTest or com.arnav.music.NavigationTest#everyBottomTabOpensItsScreen"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same optional inputs as the release build. All may be empty: the app must work without them.
      # No YouTube key in UI tests: runs stay deterministic and never spend the daily quota.
      YOUTUBE_API_KEY: ""
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      API_LEVEL: 34
      TEST_FILTER: ${{ github.event.inputs.test_filter }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config provided by secret (overrides the committed file)"
          elif [ -f app/google-services.json ]; then
            echo "Using committed app/google-services.json"
          else
            echo "No Firebase config: building local-only edition"
          fi

      # Compile first (no emulator running yet), so compile errors show up quickly and cheaply.
      - name: Build debug app + test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_6-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: echo "Generated AVD snapshot for caching."

      # Each script line runs in its own `sh -c`; a failing line would abort the rest, so the test run
      # records failure in a marker file and logcat is always collected while the emulator is still up.
      - name: Run instrumented tests
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          script: |
            mkdir -p ui-test-logs && rm -f ui-test-logs/FAILED
            adb logcat -G 16M || true
            adb logcat -c || true
            # Slow CI emulators show "System UI isn't responding" dialogs that steal key events.
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest ${TEST_FILTER:+-Pandroid.testInstrumentationRunnerArguments.class=$TEST_FILTER} || touch ui-test-logs/FAILED
            adb logcat -d -v threadtime > ui-test-logs/logcat-full.txt || true
            adb logcat -d -b crash -v threadtime > ui-test-logs/logcat-crash.txt || true
            adb shell dumpsys activity exit-info com.arnav.music > ui-test-logs/exit-info.txt || true
            echo "Window focus after tests:"; adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            echo "App errors in logcat:"; grep -E " (E|F) " ui-test-logs/logcat-full.txt | grep -iE "arnav|AndroidRuntime|compose|lifecycle|glance|IllegalState" | grep -v "TestRunner" | tail -n 120 || true
            adb exec-out screencap -p > ui-test-logs/final-screen.png || true

      - name: App crashes in logcat
        if: always()
        run: |
          if [ -s ui-test-logs/logcat-crash.txt ]; then
            echo "::group::Crash buffer (adb logcat -b crash)"
            tail -n 400 ui-test-logs/logcat-crash.txt
            echo "::endgroup::"
          else
            echo "Crash buffer is empty."
          fi
          if [ -f ui-test-logs/logcat-full.txt ]; then
            echo "::group::Errors from AndroidRuntime / FATAL / com.arnav.music / test runner"
            # threadtime format: date time pid tid LEVEL TAG: message
            awk '$5 == "E" || $5 == "F"' ui-test-logs/logcat-full.txt \
              | grep -E "AndroidRuntime|FATAL|ArnavTestCrash|ArnavTest|TestRunner|com\.arnav\.music|ANR in" \
              | tail -n 400 || true
            echo "::endgroup::"
            echo "::group::FATAL EXCEPTION blocks (full context)"
            grep -n -A 40 -E "FATAL EXCEPTION|ArnavTestCrash" ui-test-logs/logcat-full.txt | head -n 600 || true
            echo "::endgroup::"
          else
            echo "No logcat captured (emulator may not have booted)."
          fi

      - name: Test results summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          out = []
          if not files:
              out.append("No instrumented test result XML found (build or emulator failure? see the steps above).")
          total = failed = skipped = 0
          failures = []
          for f in files:
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError as e:
                  out.append(f"Could not parse {f}: {e}")
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  name = f"{case.get('classname', '?').split('.')[-1]}.{case.get('name', '?')}"
                  if case.find("skipped") is not None:
                      skipped += 1
                      continue
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      failed += 1
                      text = (problem.get("message") or "") + "\n" + (problem.text or "")
                      lines = [l for l in text.splitlines() if l.strip()]
                      keep = []
                      # Keep app/compose/lifecycle frames and every "Caused by"/"Suppressed" line.
                      for l in lines:
                          s = l.strip()
                          if s.startswith("at ") and not any(k in s for k in ("com.arnav.music", "androidx.compose.ui.platform", "androidx.lifecycle", "androidx.glance", "androidx.activity", "android.view")):
                              continue
                          keep.append(l.rstrip())
                          if len(keep) >= 70:
                              break
                      failures.append((name, keep))
          out.insert(0, f"Instrumented tests: {total} run, {failed} failed, {skipped} skipped ({len(files)} result file(s))")
          for name, keep in failures:
              out.append("")
              out.append(f"FAILED: {name}")
              out.extend("    " + l for l in keep)
              first = (keep[0] if keep else "").replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::error title=UI test failed: {name}::{first[:300]}")
          print("\n".join(out))
          if summary_path:
              with open(summary_path, "a") as s:
                  s.write("### Instrumented UI tests\n\n```\n" + "\n".join(out) + "\n```\n")
          PY

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            ui-test-logs/
          if-no-files-found: ignore

      - name: Fail if instrumented tests failed
        if: always()
        run: |
          if [ -f ui-test-logs/FAILED ]; then
            echo "Instrumented tests failed — see 'Test results summary' and 'App crashes in logcat' above."
            exit 1
          fi
          if [ ! -f ui-test-logs/logcat-full.txt ]; then
            echo "The emulator test step did not complete."
            exit 1
          fi
