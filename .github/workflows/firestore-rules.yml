name: Firestore rules

on:
  push:
    paths: [ "firebase/**", "firebase.json", ".github/workflows/firestore-rules.yml" ]
  pull_request:
    paths: [ "firebase/**", "firebase.json" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: firebase/tests
        run: npm install --no-audit --no-fund
      - name: Test rules against the emulator
        working-directory: firebase/tests
        run: npx firebase emulators:exec --only firestore --project demo-arnav-music --config ../../firebase.json "node --test rules.test.mjs"
