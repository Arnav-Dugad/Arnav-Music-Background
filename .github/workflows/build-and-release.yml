name: Build & Release

on:
  push:
    branches: [ main, "claude/**" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # All optional. Without them the APK runs in local-only mode (no cloud sync / Gemini),
      # and users can paste their own YouTube Data API key in Settings → Arnav AI & Sources.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config provided by secret (overrides the committed file)"
          elif [ -f app/google-services.json ]; then
            echo "Using committed app/google-services.json (cloud edition)"
          else
            echo "No Firebase config: building local-only edition"
          fi
          if [ -f app/google-services.json ]; then
            python3 -c "import json;d=json.load(open('app/google-services.json'));pk=[c['client_info']['android_client_info']['package_name'] for c in d['client']];assert 'com.arnav.music' in pk, pk;print('Firebase project', d['project_info']['project_id'], 'packages', pk)"
          fi

      - name: Provide private signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ARNAV_KEYSTORE_BASE64 }}
          ARNAV_KEYSTORE_PASSWORD: ${{ secrets.ARNAV_KEYSTORE_PASSWORD }}
          ARNAV_KEY_ALIAS: ${{ secrets.ARNAV_KEY_ALIAS }}
          ARNAV_KEY_PASSWORD: ${{ secrets.ARNAV_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ARNAV_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ARNAV_KEYSTORE_PASSWORD=$ARNAV_KEYSTORE_PASSWORD"
              echo "ARNAV_KEY_ALIAS=$ARNAV_KEY_ALIAS"
              echo "ARNAV_KEY_PASSWORD=$ARNAV_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --continue :core:domain:test :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Assemble release APK (R8)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee -a build.log

      - name: Lint
        run: ./gradlew :app:lintRelease
        continue-on-error: true

      - name: Collect APK
        id: apk
        run: |
          VERSION="1.0.$((1000 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ArnavMusic-${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ArnavMusic-${{ steps.apk.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Error summary
        if: failure()
        run: |
          echo "::group::Compiler / test errors"
          grep -E "^e: |^w: .*(error)|FAILED|What went wrong|AssertionError|Expected|\.kt:[0-9]+" build.log | grep -v "^w: " | head -n 120 || true
          echo "::endgroup::"
          {
            echo '### Build errors'
            echo '```'
            grep -E "^e: |FAILED|What went wrong" build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== ERRORS ==="
          grep -E "^e: " build.log | head -n 80 || true
          grep -B2 -A12 "FAILED$" build.log | grep -vE "^\s+at (org.gradle|java\.|jdk\.|sun\.)" | head -n 80 || true

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Release notes
        id: notes
        if: github.event_name != 'pull_request'
        run: |
          # Read from git so manual (workflow_dispatch) runs get notes too; drop trailer lines.
          msg="$(git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' || true)"
          {
            echo "text<<ARNAV_NOTES_EOF"
            echo "$msg"
            echo "ARNAV_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$msg" | grep -q '\[no-release\]'; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Verify release checks
        if: github.event_name != 'pull_request' && steps.notes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          required = {'UI tests (emulator)', 'Firestore rules'}
          deadline = time.monotonic() + 35 * 60
          previous = None
          while time.monotonic() < deadline:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              latest = {}
              for run in runs:
                  if run['name'] in required and run['event'] == 'push' and run['head_branch'] == os.environ['GITHUB_REF_NAME']:
                      if run['id'] > latest.get(run['name'], {}).get('id', 0):
                          latest[run['name']] = run
              status = {name: (latest[name]['status'], latest[name]['conclusion']) if name in latest else ('waiting', None) for name in sorted(required)}
              if status != previous:
                  print(status, flush=True)
                  previous = status
              if any(state == 'completed' and conclusion != 'success' for state, conclusion in status.values()):
                  raise SystemExit('Release blocked: a required validation failed.')
              if all(state == 'completed' and conclusion == 'success' for state, conclusion in status.values()):
                  break
              time.sleep(15)
          else:
              raise SystemExit('Release blocked: validation did not finish in time.')
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.notes.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Arnav Music ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            **Arnav Music ${{ steps.apk.outputs.version }}** — built from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            ### What's new
            ${{ steps.notes.outputs.text }}

            Installed copies update themselves from this page (Settings → App updates).

            ### Install
            1. Download `ArnavMusic-${{ steps.apk.outputs.version }}.apk` below.
            2. Open it on your Android phone (Android 8.0+) and allow "Install unknown apps" for your browser if asked.
            3. Updates install over the previous build (same signing key).

            Builds from this repository are signed with the public community key unless a private key is configured. Verify with `SHA256SUMS.txt`.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
